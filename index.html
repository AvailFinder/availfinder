<!DOCTYPE html>
<html>
<head>
  <title>AvailFinder Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="background:#080b12;color:white;font-family:Arial;text-align:center;padding:50px">

  <h1 style="font-size:40px">
    AvailFinder
  </h1>

  <p style="color:#aaa">
    Website test is working.
  </p>

  <input
    id="search"
    placeholder="Search Netflix"
    style="padding:15px;width:250px;border-radius:8px;border:0"
  >

  <button
    onclick="searchNow()"
    style="padding:15px;margin-left:5px;border:0;border-radius:8px;background:#7c5cff;color:white"
  >
    Search
  </button>

  <div id="result" style="margin-top:40px;font-size:25px"></div>

<script>

function searchNow(){

  let text =
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  if(text === "netflix"){

    document.getElementById("result").innerHTML =
      "✅ Netflix found!";

  }else if(text === "pubg" || text === "pubg mobile"){

    document.getElementById("result").innerHTML =
      "✅ PUBG Mobile found!";

  }else{

    document.getElementById("result").innerHTML =
      "❌ No result for: " + text;

  }

}

</script>

</body>
</html>
