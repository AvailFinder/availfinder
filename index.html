<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvailFinder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
    }

    header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
    }

    .tagline {
      color: #aab2c5;
      margin-top: 10px;
      font-size: 17px;
    }

    .search-box {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 20px;
    }

    input,
    select {
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: 1px solid #30384d;
      background: #151b29;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 20px 25px;
    }

    .category {
      background: #151b29;
      border: 1px solid #30384d;
      padding: 10px 15px;
      border-radius: 20px;
      color: #cbd2e3;
    }

    #results {
      max-width: 700px;
      margin: 10px auto 50px;
      padding: 0 20px;
    }

    .card {
      background: #151b29;
      border: 1px solid #30384d;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-top: 0;
    }

    .available {
      color: #4ade80;
      font-weight: bold;
    }

    .not-available {
      color: #f87171;
      font-weight: bold;
    }

    .official-link {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 18px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #929aae;
      padding: 30px;
    }

    footer {
      text-align: center;
      color: #687187;
      padding: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>AvailFinder</h1>
    <div class="tagline">Find where anything is available.</div>
  </header>

  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Search apps, games, movies, music..."
    >

    <select id="countrySelect">
      <option value="India">🇮🇳 India</option>
      <option value="USA">🇺🇸 USA</option>
      <option value="UK">🇬🇧 UK</option>
      <option value="Canada">🇨🇦 Canada</option>
      <option value="Australia">🇦🇺 Australia</option>
      <option value="Germany">🇩🇪 Germany</option>
      <option value="Japan">🇯🇵 Japan</option>
      <option value="South Korea">🇰🇷 South Korea</option>
      <option value="Brazil">🇧🇷 Brazil</option>
      <option value="France">🇫🇷 France</option>
    </select>

  </div>

  <div class="categories">
    <div class="category">📱 Apps</div>
    <div class="category">🎮 Games</div>
    <div class="category">🎬 Movies</div>
    <div class="category">📺 TV Shows</div>
    <div class="category">🎵 Music</div>
    <div class="category">💻 Software</div>
  </div>

  <div id="results">
    <div class="empty">
      Search for something above.
    </div>
  </div>

  <footer>
    © 2026 AvailFinder
  </footer>

  <script>

    let database = [];

    const searchInput = document.getElementById("searchInput");
    const countrySelect = document.getElementById("countrySelect");
    const results = document.getElementById("results");

    // Load our separate database
    fetch("./data.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load data.json");
        }

        return response.json();
      })
      .then(data => {
        database = data;
        console.log("AvailFinder database loaded");
      })
      .catch(error => {
        results.innerHTML = `
          <div class="empty">
            ❌ Database could not be loaded.
          </div>
        `;

        console.error(error);
      });


    function searchDatabase() {

      const searchText = searchInput.value.toLowerCase().trim();
      const country = countrySelect.value;

      if (searchText === "") {
        results.innerHTML = `
          <div class="empty">
            Search for something above.
          </div>
        `;
        return;
      }

      const matches = database.filter(item =>
        item.name.toLowerCase().includes(searchText) ||
        item.category.toLowerCase().includes(searchText)
      );

      if (matches.length === 0) {

        results.innerHTML = `
          <div class="empty">
            🔍 No results found for "${searchText}"
          </div>
        `;

        return;
      }

      results.innerHTML = "";

      matches.forEach(item => {

        const available = item.countries.includes(country);

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
          <h2>${item.name}</h2>

          <p>📂 Category: ${item.category}</p>

          <p>🌍 Country: ${country}</p>

          <p class="${available ? "available" : "not-available"}">
            ${available ? "✅ Available" : "❌ Not currently listed"}
          </p>

          <p>📱 Platform: ${item.platform}</p>

          <a
            class="official-link"
            href="${item.link}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Official Source →
          </a>
        `;

        results.appendChild(card);

      });

    }


    searchInput.addEventListener("input", searchDatabase);

    countrySelect.addEventListener("change", searchDatabase);

  </script>

</body>
</html>
