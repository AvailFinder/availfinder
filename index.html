<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AvailFinder</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1020;
color:white;
}

header{
padding:20px;
text-align:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.logo span{
color:#5ee7ff;
}

.hero{
text-align:center;
padding:40px 20px;
}

.hero h1{
font-size:36px;
margin-bottom:10px;
}

.hero p{
color:#aeb8ce;
}

.search{
max-width:650px;
margin:25px auto;
display:flex;
gap:8px;
}

.search input{
flex:1;
padding:16px;
border:0;
border-radius:10px;
font-size:16px;
}

.search button{
padding:16px 20px;
border:0;
border-radius:10px;
background:#5ee7ff;
font-weight:bold;
}

.results{
max-width:700px;
margin:20px auto;
padding:20px;
}

.result{
background:#151c31;
padding:20px;
margin-bottom:15px;
border-radius:14px;
}

.result h3{
margin-top:0;
}

.available{
color:#5ee7ff;
font-weight:bold;
}

.result a{
display:inline-block;
margin-top:12px;
padding:10px 15px;
background:#5ee7ff;
color:#071018;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.categories{
max-width:900px;
margin:30px auto;
padding:20px;
}

.category-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.category{
background:#151c31;
padding:20px;
border-radius:12px;
text-align:center;
}

footer{
text-align:center;
padding:30px;
color:#707990;
}

@media(min-width:700px){
.category-grid{
grid-template-columns:repeat(3,1fr);
}
}
</style>
</head>

<body>

<header>
<div class="logo">🌍 Avail<span>Finder</span></div>
</header>

<section class="hero">

<h1>Find Where Anything Is Available</h1>

<p>Apps, games, movies, TV shows, music and software.</p>

<div class="search">

<input id="searchInput"
type="text"
placeholder="Search Minecraft, WhatsApp, Netflix...">

<button onclick="searchItem()">Search</button>

</div>

</section>

<section class="results" id="results"></section>

<section class="categories">

<h2>Explore</h2>

<div class="category-grid">

<div class="category">📱 Apps</div>
<div class="category">🎮 Games</div>
<div class="category">🎬 Movies</div>
<div class="category">📺 TV Shows</div>
<div class="category">🎵 Music</div>
<div class="category">💻 Software</div>

</div>

</section>

<footer>
© 2026 AvailFinder
</footer>

<script>

const database=[

{
name:"Minecraft",
category:"🎮 Game",
country:"🇮🇳 India",
status:"Available",
platform:"Android / PC / Console",
link:"https://www.minecraft.net/"
},

{
name:"WhatsApp",
category:"📱 App",
country:"🇮🇳 India",
status:"Available",
platform:"Android / iPhone",
link:"https://www.whatsapp.com/"
},

{
name:"Instagram",
category:"📱 App",
country:"🇮🇳 India",
status:"Available",
platform:"Android / iPhone / Web",
link:"https://www.instagram.com/"
},

{
name:"Spotify",
category:"🎵 Music",
country:"🇮🇳 India",
status:"Available",
platform:"Android / iPhone / Web",
link:"https://www.spotify.com/"
},

{
name:"Telegram",
category:"📱 App",
country:"🇮🇳 India",
status:"Available",
platform:"Android / iPhone / Web",
link:"https://telegram.org/"
},

{
name:"VLC",
category:"💻 Software",
country:"🇮🇳 India",
status:"Available",
platform:"Android / Windows / Mac",
link:"https://www.videolan.org/vlc/"
},

{
name:"Steam",
category:"💻 Software",
country:"🇮🇳 India",
status:"Available",
platform:"Windows / Mac / Linux",
link:"https://store.steampowered.com/"
},

{
name:"Fortnite",
category:"🎮 Game",
country:"🇮🇳 India",
status:"Available",
platform:"PC / Console / Android",
link:"https://www.fortnite.com/"
},

{
name:"Netflix",
category:"📺 TV & Movies",
country:"🇮🇳 India",
status:"Available",
platform:"Android / iPhone / Web / TV",
link:"https://www.netflix.com/"
},

{
name:"PUBG Mobile",
category:"🎮 Game",
country:"🇮🇳 India",
status:"Not available under this title",
platform:"Mobile",
link:"https://www.battlegroundsmobileindia.com/"
}

];

function searchItem(){

const input=document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();

const results=document
.getElementById("results");

results.innerHTML="";

if(input===""){
results.innerHTML=
"<p style='text-align:center'>Type something to search.</p>";
return;
}

const matches=database.filter(item=>
item.name.toLowerCase().includes(input)
);

if(matches.length===0){

results.innerHTML=
"<div class='result'><h3>🔎 Nothing found</h3><p>We don't have this item in our database yet.</p></div>";

return;

}

matches.forEach(item=>{

results.innerHTML+=`

<div class="result">

<h3>${item.name}</h3>

<p>${item.category}</p>

<p>${item.country}</p>

<p class="available">
${item.status}
</p>

<p>
Platform: ${item.platform}
</p>

<a href="${item.link}" target="_blank">
Official Source
</a>

</div>

`;

});

}

</script>

</body>
</html>
